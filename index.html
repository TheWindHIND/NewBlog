<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>枫的博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f1117;
      color: #e6e6e6;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    p { color: #8a8f98; margin-bottom: 2rem; }
    a {
      color: #4ea1ff;
      text-decoration: none;
      border: 1px solid #2a3242;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    a:hover { border-color: #4ea1ff; background: rgba(78, 161, 255, 0.08); }
  </style>
</head>
<body>
  <main>
    <h1>枫的博客</h1>
    <p>建设中 — a blog under construction</p>
    <a href="https://github.com/TheWindHIND/NewBlog">GitHub 仓库</a>
  </main>
</body>
</html>
